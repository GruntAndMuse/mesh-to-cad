name: Build executables

# WHY this exists: users shouldn't need Python, a build environment, or
# technical knowledge to use mesh-to-cad. Every push to main automatically
# builds standalone executables for Windows, macOS, and Linux.
# Users download from the Releases page. That's it.
#
# Dennis's rule: "as close to 1 thing that does everything as possible."
# A download-and-double-click exe is the closest we can get.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:  # manual trigger from the Actions tab

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            exe_name: mesh-to-cad.exe
            artifact_name: mesh-to-cad-windows
          - os: ubuntu-latest
            exe_name: mesh-to-cad
            artifact_name: mesh-to-cad-linux
          - os: macos-latest
            exe_name: mesh-to-cad
            artifact_name: mesh-to-cad-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
          pip install pyinstaller

      - name: Stamp build date
        # WHY: the offline build-age nudge needs to know when THIS binary
        # was built. Generate _build_info.py now, just before PyInstaller
        # runs — the CLI imports it (guarded: dev checkouts don't have it,
        # so no nudge, no crash), and PyInstaller's analysis bundles it
        # because the entry script imports it. The date is the RELEASE
        # build date, not the source-write date. UTC, YYYY-MM-DD.
        # Pure local clock read — zero network.
        shell: bash
        run: |
          python3 -c "from datetime import datetime, timezone; print('BUILD_DATE = \"' + datetime.now(timezone.utc).date().isoformat() + '\"')" > _build_info.py
          cat _build_info.py

      - name: Build executable
        run: pyinstaller --noconfirm mesh-to-cad.spec

      - name: Smoke test
        shell: bash
        run: |
          # The exe must at least print --help without crashing.
          # WHY: catches the "built but broken" failure we hit on 2026-10-02
          # (missing version-info.txt, scripts/ not bundled).
          ./dist/${{ matrix.exe_name }} --help
          # The build date must be stamped into --version output.
          # WHY: the offline build-age nudge depends on it; if the stamp
          # step silently failed, the release would never nudge.
          ./dist/${{ matrix.exe_name }} --version | grep -q "(built " || \
            (echo "BUILD DATE NOT STAMPED — _build_info.py missing from bundle" && exit 1)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.exe_name }}

  release:
    # Only create a GitHub Release when a version tag is pushed (e.g. v1.0.0).
    # Regular pushes to main just build and test — artifacts are available
    # from the Actions tab without cluttering the Releases page.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Rename for unique release assets
        # WHY: ubuntu and macos both build a file called "mesh-to-cad".
        # Release assets must have unique names or one silently overwrites
        # the other (caught 2026-10-02 on v1.0.0 — macOS binary lost).
        shell: bash
        run: |
          mv ./artifacts/mesh-to-cad-linux/mesh-to-cad ./artifacts/mesh-to-cad-linux/mesh-to-cad-linux
          mv ./artifacts/mesh-to-cad-macos/mesh-to-cad ./artifacts/mesh-to-cad-macos/mesh-to-cad-macos
          mv ./artifacts/mesh-to-cad-windows/mesh-to-cad.exe ./artifacts/mesh-to-cad-windows/mesh-to-cad-windows.exe
          ls ./artifacts/*/*

      - name: Generate checksums.txt
        # WHY: the transport (HTTPS download vs USB sneakernet) was never
        # the security — VERIFICATION is. Every release ships a checksums.txt
        # (SHA-256, one "<hash>  <filename>" line per asset) so `update` can
        # verify downloads and air-gapped users can verify USB copies.
        # Filenames are the release asset basenames, matching what
        # `mesh-to-cad update` looks up.
        shell: bash
        run: |
          (cd ./artifacts/mesh-to-cad-linux && sha256sum mesh-to-cad-linux) > ./artifacts/checksums.txt
          (cd ./artifacts/mesh-to-cad-macos && sha256sum mesh-to-cad-macos) >> ./artifacts/checksums.txt
          (cd ./artifacts/mesh-to-cad-windows && sha256sum mesh-to-cad-windows.exe) >> ./artifacts/checksums.txt
          cat ./artifacts/checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/**/*
          generate_release_notes: true
          body: |
            Standalone executables — no Python needed. Download for your OS,
            then run `mesh-to-cad your-file.stl`.

            See CHANGELOG.md for what changed.
